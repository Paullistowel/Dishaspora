server:
  port: ${PORT:8080}

spring:
  application:
    name: dishaspora-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dishaspora}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

jwt:
  secret: ${JWT_SECRET:dishaspora-dev-secret-key-please-change-in-production-4f8a2c1e9b7d6350a1b2c3d4e5f60718}
  # Short-lived access token (30 min). The client silently refreshes it using the
  # long-lived refresh token below (30 days), which is rotated on every use.
  expiration-ms: ${JWT_EXPIRATION_MS:1800000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:}
  public-key: ${PAYSTACK_PUBLIC_KEY:}
  # Live payments only by default: with no secret key the client refuses to
  # process payments (rather than mock-approving them). Set PAYSTACK_ALLOW_MOCK=true
  # ONLY for a local demo without Paystack credentials.
  allow-mock: ${PAYSTACK_ALLOW_MOCK:false}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

openai:
  api-key: ${OPENAI_API_KEY:}

# AI provider for Snap & Cook + the assistant: "openai", "anthropic", or "auto"
# (default) which prefers whichever key is set (OpenAI first).
ai:
  provider: ${AI_PROVIDER:auto}

media:
  upload-dir: ./uploads

# Public base URL used to build links in verification / reset emails.
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:Dishaspora <no-reply@dishaspora.app>}

auth:
  # Set AUTH_REQUIRE_VERIFIED_EMAIL=true once SMTP is configured to block
  # unverified users at login. Left false so seeded/demo accounts keep working.
  require-verified-email: ${AUTH_REQUIRE_VERIFIED_EMAIL:false}

# CORS: "*" for local dev / Expo tunnel. In production set CORS_ALLOWED_ORIGINS to
# a comma-separated allow-list of your real web/admin origins.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# In-memory rate limiting for sensitive auth endpoints (login/register/forgot/
# reset/resend). Caps requests per client IP per window. Disable for load tests.
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  max-requests: ${RATE_LIMIT_MAX:10}
  window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

# NOTE: SMTP is intentionally NOT declared here. Set SPRING_MAIL_HOST (+ PORT,
# USERNAME, PASSWORD) in the environment to enable real email; when unset, no
# JavaMailSender bean is created and EmailService logs messages instead.

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/dishaspora;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
